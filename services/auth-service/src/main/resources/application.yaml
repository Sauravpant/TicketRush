spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth-db
    username: auth_user
    password: auth_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ticketrush.authservice: DEBUG
    org.hibernate.SQL: WARN

jwt:
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30
  issuer: ticketrush-auth-service
  private-key-path: file:///C:/Users/user/ticketrush-local-keys/private_key.pem
  public-key-path: file:///C:/Users/user/ticketrush-local-keys/public_key.pem

auth:
  cookie:
    access-token-name: access_token
    refresh-token-name: refresh_token
    secure: false
    domain: